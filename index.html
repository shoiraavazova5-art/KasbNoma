<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f83">
<title>KASBNOMA — Kelajagingni kashf et!</title>
<style>
:root{--teal:#087f83;--dark:#075b60;--gold:#d8ad50;--bg:#f3f8f7;--ink:#173b3c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--dark),var(--teal));color:#fff;padding:25px 20px 30px;border-radius:0 0 25px 25px}
.brand{font-size:27px;font-weight:800;letter-spacing:2px}.brand span{color:#f4cf78}
header p{margin-bottom:0;color:#e3f5f1}
main{padding:20px;max-width:680px;margin:auto}
.welcome{background:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 4px 18px #12333310}
.welcome h2{margin-top:0;color:var(--dark)}
.section-title{margin:25px 0 13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#fff;border:1px solid #e0ece9;border-radius:16px;padding:17px 12px;text-align:left;cursor:pointer;color:var(--ink);font-size:15px;min-height:115px}
.item:active{transform:scale(.98)}
.emoji{font-size:27px;display:block;margin-bottom:10px}
.item strong{display:block;margin-bottom:5px}.item small{color:#718786}
.panel{display:none;background:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 4px 18px #12333310}
.panel h2{color:var(--dark)}
.back,.answer-btn{background:var(--teal);color:white;border:0;padding:12px 16px;border-radius:11px;cursor:pointer;font-size:15px}
.answer-btn{display:block;width:100%;text-align:left;background:#f2f8f7;color:var(--ink);border:1px solid #d9e9e6;margin:9px 0;padding:15px}
.answer-btn:active{background:#dcefed}
.progress{height:8px;background:#e4efed;border-radius:20px;overflow:hidden;margin:12px 0 20px}
.progress span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.result{background:#f5f8ed;border-left:4px solid var(--gold);padding:14px;border-radius:10px;margin:12px 0}
footer{text-align:center;padding:25px;color:#718786;font-size:13px}
@media(max-width:360px){main{padding:14px}.grid{gap:9px}.item{padding:13px 10px}}
</style>
</head>
<body>
<header>
  <div class="brand">KASB<span>NOMA</span></div>
  <p>Kelajagingni bugundan kashf et!</p>
</header>

<main>
  <div id="home">
    <section class="welcome">
      <h2>Assalomu alaykum! 👋</h2>
      <p>O‘z qiziqishingni kashf et, qobiliyatingni anglab yet va kelajak kasbingni tanla!</p>
    </section>
    <h3 class="section-title">O‘rganish va kashf qilish</h3>
    <div class="grid">
      <button class="item" onclick="openPage('test')"><span class="emoji">🧠</span><strong>Kasb testi</strong><small>Qiziqishlaringni aniqlash</small></button>
      <button class="item" onclick="openPage('jobs')"><span class="emoji">📚</span><strong>Kasblar olami</strong><small>Turli kasblarni o‘rganish</small></button>
      <button class="item" onclick="openPage('study')"><span class="emoji">🎓</span><strong>Ta’lim yo‘llari</strong><small>Qayerda tahsil olish mumkin?</small></button>
      <button class="item" onclick="openPage('skills')"><span class="emoji">🛠️</span><strong>Amaliy ko‘nikmalar</strong><small>Yangi mahoratlarni o‘rganish</small></button>
      <button class="item" onclick="openPage('portfolio')"><span class="emoji">🏆</span><strong>Mening portfoliom</strong><small>Yutuq va maqsadlarim</small></button>
      <button class="item" onclick="openPage('map')"><span class="emoji">🗺️</span><strong>Kasb xaritasi</strong><small>O‘zbekistondagi imkoniyatlar</small></button>
    </div>
  </div>

  <section class="panel" id="page">
    <button class="back" onclick="goHome()">← Bosh sahifa</button>
    <div id="pageContent"></div>
  </section>
</main>
<footer>KASBNOMA © 2026<br>Bilim — kelajak sari yo‘l!</footer>

<script>
const pages={
 jobs:{title:"📚 Kasblar olami",text:"Shifokor, muhandis, o‘qituvchi, dasturchi, dizayner va boshqa kasblar haqida ma’lumotlar shu yerda jamlanadi."},
 study:{title:"🎓 Ta’lim yo‘llari",text:"Maktabdan keyingi ta’lim, kasb-hunar maktablari, texnikumlar va oliy ta’lim yo‘nalishlari haqida ma’lumotlar."},
 skills:{title:"🛠️ Amaliy ko‘nikmalar",text:"Muloqot, ijodkorlik, muammolarni hal qilish, raqamli savodxonlik va boshqa ko‘nikmalar."},
 portfolio:{title:"🏆 Mening portfoliom",text:"Bu bo‘limda kelajakdagi maqsadlaringiz, loyihalaringiz va yutuqlaringizni jamlaysiz. Hozircha ma’lumotlar ushbu qurilmada saqlanmaydi."},
 map:{title:"🗺️ Kasb xaritasi",text:"O‘zbekiston hududlaridagi ta’lim va kasbiy imkoniyatlar haqidagi ma’lumotlar keyingi bosqichda qo‘shiladi."}
};

const questions=[
 {q:"Bo‘sh vaqtingizda nima qilishni yoqtirasiz?",a:[["Odamlarga yordam berish","people"],["Texnika va qurilmalarni o‘rganish","tech"],["Rasm chizish va ijod qilish","creative"],["Tabiat va hayvonlarga g‘amxo‘rlik","nature"]]},
 {q:"Qaysi mashg‘ulot sizga ko‘proq qiziq?",a:[["Bolalarga bilim berish","people"],["Kompyuterda ishlash","tech"],["Yangi g‘oyalar yaratish","creative"],["O‘simliklarni parvarishlash","nature"]]},
 {q:"Qaysi fan yoki yo‘nalish sizga yoqadi?",a:[["Biologiya va inson salomatligi","people"],["Matematika va informatika","tech"],["San’at va adabiyot","creative"],["Tabiatshunoslik","nature"]]},
 {q:"Jamoada qanday vazifani yoqtirasiz?",a:[["Boshqalarga yordam berish","people"],["Muammoni tahlil qilib yechish","tech"],["Yangi fikrlar taklif qilish","creative"],["Amaliy ishlarni bajarish","nature"]]},
 {q:"Kelajakdagi ishingiz qanday bo‘lishini istaysiz?",a:[["Insonlar hayotini yaxshilash","people"],["Yangi texnologiyalar yaratish","tech"],["Chiroyli va foydali narsalar yaratish","creative"],["Tabiatni asrash va parvarishlash","nature"]]}
];
const directionNames={
 people:"Insonlar bilan ishlash: o‘qituvchi, shifokor, psixolog yoki ijtimoiy soha mutaxassisi",
 tech:"Texnika va texnologiya: dasturchi, muhandis yoki IT mutaxassisi",
 creative:"Ijodiy soha: dizayner, rassom, arxitektor yoki yozuvchi",
 nature:"Tabiat va hayot: agronom, ekolog, veterinar yoki biolog"
};
let questionIndex=0;
let answers=[];

function openPage(id){
 document.getElementById("home").style.display="none";
 document.getElementById("page").style.display="block";
 if(id==="test"){startTest();return;}
 const p=pages[id];
 document.getElementById("pageContent").innerHTML="<h2>"+p.title+"</h2><p>"+p.text+"</p>";
 window.scrollTo(0,0);
}
function goHome(){
 document.getElementById("page").style.display="none";
 document.getElementById("home").style.display="block";
 window.scrollTo(0,0);
}
function startTest(){
 questionIndex=0;answers=[];
 showQuestion();
}
function showQuestion(){
 const q=questions[questionIndex];
 let html="<h2>🧠 Kasbga qiziqish testi</h2>";
 html+="<p>"+(questionIndex+1)+" / "+questions.length+"-savol</p>";
 html+='<div class="progress"><span style="width:'+((questionIndex)/questions.length*100)+'%"></span></div>';
 html+="<h3>"+q.q+"</h3>";
 q.a.forEach((a,i)=>{
  html+='<button class="answer-btn" onclick="answerQuestion('+i+')">'+(i+1)+". "+a[0]+"</button>";
 });
 document.getElementById("pageContent").innerHTML=html;
 window.scrollTo(0,0);
}
function answerQuestion(choice){
 answers.push(questions[questionIndex].a[choice][1]);
 questionIndex++;
 if(questionIndex<questions.length){showQuestion();}else{showResult();}
}
function showResult(){
 const counts={people:0,tech:0,creative:0,nature:0};
 answers.forEach(a=>counts[a]++);
 const max=Math.max(...Object.values(counts));
 const winners=Object.keys(counts).filter(k=>counts[k]===max);
 let html="<h2>🏆 Sizning natijangiz!</h2>";
 html+="<p>Javoblaringizda quyidagi yo‘nalishlarga qiziqish ko‘proq ko‘rindi:</p>";
 winners.forEach(k=>{html+='<div class="result"><strong>⭐ '+directionNames[k]+"</strong></div>";});
 html+="<p>Bu qisqa tanishuv testi, kasbiy tashxis emas. Kasb tanlashda fanlardagi natijalar, qobiliyatlar, tajriba va mutaxassis maslahati ham muhim.</p>";
 html+='<button class="back" onclick="startTest()">Testni qayta ishlash</button> ';
 html+='<button class="back" onclick="goHome()">Bosh sahifa</button>';
 document.getElementById("pageContent").innerHTML=html;
 window.scrollTo(0,0);
}
</script>
</body>
</html>
